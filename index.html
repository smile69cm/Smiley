<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smiley IPTV Playlist</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #00ff88; }
        input { width: 80%; padding: 10px; border-radius: 5px; border: none; margin-top: 10px; background: #333; color: #fff; text-align: center; }
        button { background: #00ff88; color: black; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #00cc6e; }
        .channel-list { margin-top: 20px; text-align: left; }
        .channel { padding: 10px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Smiley TV 📺</h1>
        <p>Copy your playlist link below:</p>
        <input type="text" value="https://telugu.bot.nu/Smiley/playlist.m3u" id="link" readonly>
        <br>
        <button onclick="copyLink()">Copy Link</button>

        <div class="channel-list">
            <h3>Available Channels:</h3>
            <div class="channel"><span>Zee Telugu HD</span> <small>Dish</small></div>
            <div class="channel"><span>Zee Telugu HD</span> <small>Jio</small></div>
            <div class="channel"><span>Zee Telugu FHD</span> <small>WorldTV</small></div>
        </div>
    </div>

    <script>
        function copyLink() {
            var copyText = document.getElementById("link");
            copyText.select();
            document.execCommand("copy");
            alert("Playlist Link Copied!");
        }
    </script>

</body>
</html>
